name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Storage version
      description: Shown in Settings
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip (Apple silicon or Intel)
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - Storage.app
        - node server.js
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
